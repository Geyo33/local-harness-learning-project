[project]
name = "memory-retrieval"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "spacy>=3.7.0",
]

[project.scripts]
memory-retrieval = "server:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["server.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
