[project]
name = "local-harness-learning-project"
version = "0.1.0"
description = "Learning project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=6.11.0",
    "mcp>=1.26.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.32.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_chatbot"]
